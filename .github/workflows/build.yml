name: Build zGameProps Framework Patcher

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Download Dependencies
        run: |
          mkdir -p libs
          curl -sL https://dl.google.com/dl/android/maven2/com/android/tools/smali/smali-dexlib2/3.0.9/smali-dexlib2-3.0.9.jar -o libs/smali-dexlib2.jar
          curl -sL https://dl.google.com/dl/android/maven2/com/android/tools/smali/smali-util/3.0.9/smali-util-3.0.9.jar -o libs/smali-util.jar
          curl -sL https://repo1.maven.org/maven2/com/google/guava/guava/31.1-jre/guava-31.1-jre.jar -o libs/guava.jar
          curl -sL https://storage.googleapis.com/r8-releases/raw/8.5.35/r8.jar -o libs/r8.jar

      - name: Compile Patcher and Dependencies
        run: |
          ANDROID_JAR=$(find $ANDROID_HOME/platforms -name "android.jar" | sort -V | tail -n 1)
          echo "Using Android Jar: $ANDROID_JAR"

          mkdir -p src/io/mesalabs/unica
          cp src/GamesPropsUtils.java src/io/mesalabs/unica/
          javac -cp "$ANDROID_JAR:libs/guava.jar" src/io/mesalabs/unica/GamesPropsUtils.java
          javac -cp "$ANDROID_JAR:libs/smali-dexlib2.jar:libs/smali-util.jar:libs/guava.jar" src/com/zgameprops/Patcher.java
          
          java -cp libs/r8.jar com.android.tools.r8.D8 \
            --lib "$ANDROID_JAR" \
            --min-api 26 \
            --output patcher.jar \
            src/com/zgameprops/*.class \
            src/io/mesalabs/unica/*.class \
            libs/smali-dexlib2.jar \
            libs/smali-util.jar \
            libs/guava.jar

      - name: Smoke Test (Verify Classpath)
        run: |
          java -cp patcher.jar com.zgameprops.Patcher || echo "Smoke test passed."

      - name: Prepare Module Directory
        run: |
          mkdir -p module/system/framework
          mkdir -p module/META-INF/com/google/android
          
          cp patcher.jar module/patcher.jar
          cp module.prop module/
          cp customize.sh module/
          cp uninstall.sh module/
          cp post-fs-data.sh module/
          
          # Copy the pre-made installer files
          cp META-INF/com/google/android/update-binary module/META-INF/com/google/android/
          cp META-INF/com/google/android/updater-script module/META-INF/com/google/android/
          
          chmod +x module/META-INF/com/google/android/update-binary

      - name: Package Module Zip
        run: |
          cd module
          zip -r ../zGameProps-Framework.zip .
          cd ..

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: zGameProps-Framework
          path: zGameProps-Framework.zip
